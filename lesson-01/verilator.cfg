// Flags shared by every build in this lesson.
//
//   verilator -Wall -f verilator.cfg -Mdir <dir> --top-module <top> -o sim <file>
//
// -Wall is passed on the command line, before this file. The suppressions
// below come after it, and would be undone the other way round.
//
// Read this file once. Nothing in it changes what a design is allowed to do:
// the only warnings switched off are about how these files are packaged. A
// suppression that hides something about a circuit does not belong here.

// --- what to produce -------------------------------------------------------
--binary              // a runnable simulator, not just generated C++
--timing              // support #, @ and wait, which the testbenches use
--trace               // write a VCD while the simulation runs

// --- what to report --------------------------------------------------------
-Wno-fatal            // carry on after a warning instead of stopping, so a
                      // warning still leaves you a trace to look at

// --- noise from how these files are packaged, never from a design ----------
-Wno-DECLFILENAME     // several modules share one file
-Wno-UNUSEDSIGNAL     // the testbenches record a trace without reading back
-Wno-PROCASSINIT      // the counter testbench declares its clock with an
                      // initial value and then drives it

// --- build mechanics -------------------------------------------------------
-j 4                  // four parallel jobs
--quiet-build         // hide the generated C++ compile lines
--quiet-stats         // hide Verilator's own statistics block
--no-skip-identical   // recompile even when the output is up to date, so the
                      // warnings appear every time and not only the first
